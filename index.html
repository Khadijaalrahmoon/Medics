<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medics</title>

    <!-- ربط ملف CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- شريط التنقل -->
    <header class="navbar">

        <!-- الشعار -->
        <div class="logo">
             <i class="fa-solid fa-heart-pulse"></i>
            <span class="logo-name">Medics</span>
        </div>

        <!-- روابط الصفحات -->
        <nav class="nav-links">
    <a href="#">Home</a>
    <a href="#">Doctors</a>
    <a href="#">About</a>
</nav>

        <!-- أزرار الدخول والتسجيل -->
        <div class="nav-buttons">
            <button class="login-btn">login</button>
            <button class="signup-btn">sign up</button>
        </div>

    </header>


    <!-- القسم الرئيسي -->
    <main class="hero">

        <!-- الجهة اليسرى -->
        <section class="hero-content">

            <h1>
                Your Health,<br>
                our priority
            </h1>

            <p>
                Book your appointment with<br>
                the right doctor easily and<br>
                quickly
            </p>


            <!-- مربع البحث -->
            <div class="search-box">

                <input
                    type="text"
                    id="doctorSearch"
                    placeholder="search doctors specialties..."
                >

                <button id="searchBtn">
                    search
                </button>

            </div>


            <!-- الأزرار الرئيسية -->
            <div class="main-buttons">

                <button class="find-btn" id="findDoctorBtn">
                    Find A Doctor
                </button>

                <button class="appointment-btn" id="appointmentBtn">
                    Book an appointment
                </button>

            </div>


            <!-- البطاقات الثلاث -->
            <div class="cards">

                <div class="card">

                    <div class="card-icon">
                        ♧
                    </div>

                    <h3>Outfilled Doctors</h3>

                    <p>
                        Experienced and verified<br>
                        doctors
                    </p>

                </div>


                <div class="card">

                    <div class="card-icon">
                        ▤
                    </div>

                    <h3>Easy Booking</h3>

                    <p>
                        Book appointment in<br>
                        just a few checks
                    </p>

                </div>


                <div class="card">

                    <div class="card-icon">
                        ♡
                    </div>

                    <h3>Quality Care</h3>

                    <p>
                        We Care your<br>
                        health
                    </p>

                </div>

            </div>

        </section>


        <!-- الجهة اليمنى: صورة الدكتور -->
        <section class="hero-image">

            <div class="image-background"></div>

            <!-- رح نحط صورة الدكتور هون -->
            <img src="images/doctor.png" alt="Doctor">

        </section>

    </main>


    <!-- ربط JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
