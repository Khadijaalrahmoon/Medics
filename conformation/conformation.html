<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Confirmed - Medics</title>
    <link rel="stylesheet" href="conformation.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">Medics</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Find a Doctor</a>
            <a href="#">Specialties</a>
        </nav>
        <div class="nav-icons">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-regular fa-user"></i>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Success Icon -->
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h1>Appointment Confirmed!</h1>
        <p class="subtitle">Your appointment has been successfully booked.</p>

        <!-- Doctor Card -->
        <div class="doctor-card">
            <img src="image/ahmedkhalil.jpg" alt="Dr. Ahmad Khalil" class="doctor-img">
            <div class="doctor-info">
                <h3>Dr.Ahmad Khalil</h3>
                <p class="specialty">Cardiologist</p>
                <div class="details">
                    <div class="detail-item">
                        <i class="fa-regular fa-calendar"></i>
                        <span>September 10, 2026</span>
                    </div>
                    <div class="detail-item">
                        <i class="fa-regular fa-clock"></i>
                        <span>10:00 AM</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn btn-primary">View My Appointment &rarr;</button>
            <button class="btn btn-secondary">Back To Home</button>
        </div>
    </main>

</body>
</html>
